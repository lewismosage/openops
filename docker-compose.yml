services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - openops_data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/openops.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      - SEED_ADMIN_EMAIL=maendalewis20@gmail.com
      - SEED_ADMIN_PASSWORD=@Lewis9590
      - SEED_ADMIN_NAME=Lewis
      - FRONTEND_URL=http://localhost:3000
      - EXPOSE_PASSWORD_RESET_LINKS=true

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    profiles:
      - full

volumes:
  openops_data:
